[workspace]
resolver = "2"
members = [
    "crates/ubu-planning-core",
    "crates/ubu-planning-cpu",
    "crates/ubu-planning-worker-protocol",
    "crates/ubu-planning-cli",
    "crates/ubu-planning-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/UbU-project/ubu-planning-kernel"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "1"
ubu_core = { git = "https://github.com/UbU-project/ubu-core", rev = "fa26bf678977f5e077229eb97a39cc1b8b960c9b" }
ubu_planning_core = { path = "crates/ubu-planning-core" }
ubu_planning_cpu = { path = "crates/ubu-planning-cpu" }

time = { version = "0.3", features = ["formatting", "parsing"] }
ubu_planning_worker_protocol = { path = "crates/ubu-planning-worker-protocol" }
