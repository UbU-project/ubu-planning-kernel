[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubu-gpu-advisory"
version = "0.1.0"
description = "Session-local planning frame echo; no GPU computation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
torch = [
    # TODO: later PyTorch stage ticket (follow-up to P1B-70; not assigned here): pin torch when device computation lands.
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
