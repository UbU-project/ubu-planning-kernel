[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubu-gpu-advisory"
version = "0.1.0"
description = "Session-local planning worker with optional CPU tensor computation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
torch = [
    "torch==2.6.0+cpu",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
